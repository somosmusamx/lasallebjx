<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evento | MUSA La Salle Bajío</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --ev-bg: #fcfbf5;
      --ev-accent: #4a145c;
      --text-dark: #1f1627;
      --text-muted: #4b3f54;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--ev-bg);
      color: var(--text-dark);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(0, 0, 0, 0.08);
      padding: 0.85rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      font-family: 'Anton', sans-serif;
      font-size: 1.25rem;
      color: var(--ev-accent);
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    .ev-btn {
      background-color: var(--ev-accent);
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .ev-btn:hover { opacity: 0.9; }
    .ev-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .ev-main {
      max-width: 720px;
      width: 100%;
      margin: 2rem auto 3.5rem;
      padding: 0 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .flyer-wrap {
      max-width: 460px;
      width: 100%;
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
      background: #ffffff;
    }
    .flyer-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .ev-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 2rem;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }
    @media (max-width: 600px) {
      .ev-card { padding: 1.4rem; }
    }

    .ev-title {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 2.4rem);
      color: var(--ev-accent);
      line-height: 1.1;
      margin-bottom: 0.85rem;
      text-transform: uppercase;
    }
    .ev-meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .ev-pill {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-dark);
      font-size: 0.84rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }

    #ev-info-body h1, #ev-info-body h2, #ev-info-body h3 {
      color: var(--ev-accent);
      margin: 1rem 0 0.45rem;
    }
    #ev-info-body p { margin-bottom: 0.9rem; }
    #ev-info-body ul, #ev-info-body ol { margin: 0.5rem 0 1rem 1.4rem; }

    .form-title {
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      color: var(--ev-accent);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.72rem 0.95rem;
      border: 1.5px solid rgba(0, 0, 0, 0.16);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.94rem;
      background: #ffffff;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .status-msg {
      margin-top: 0.85rem;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .status-msg.ok { color: #067647; }
    .status-msg.err { color: #b42318; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="actividades.html" class="brand">MUSA · ACTIVIDADES</a>
      <a href="actividades.html" class="ev-btn">← Ver todas</a>
    </div>
  </header>

  <main class="ev-main">
    <div id="ev-loading" class="ev-card" style="text-align:center;">Cargando información del evento...</div>

    <div id="ev-content" style="display:none; flex-direction:column; gap:1.5rem;">
      <div id="ev-flyer-wrap" class="flyer-wrap" style="display:none;">
        <img id="ev-flyer-img" alt="Flyer del evento" />
      </div>

      <section class="ev-card">
        <h1 id="ev-title" class="ev-title"></h1>
        <div id="ev-pills" class="ev-meta-pills"></div>
        <div id="ev-info-body"></div>
      </section>

      <section id="ev-form-section" class="ev-card">
        <h2 class="form-title">REGISTRO AL EVENTO</h2>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.25rem;">
          Completa tus datos para confirmar tu asistencia.
        </p>
        <form id="ev-reg-form">
          <div class="form-group">
            <label for="reg-nombre">Nombre completo</label>
            <input type="text" id="reg-nombre" required placeholder="Ej. Sofía Martínez López" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="reg-matricula">Matrícula</label>
              <input type="text" id="reg-matricula" required placeholder="Ej. 123456" />
            </div>
            <div class="form-group">
              <label for="reg-semestre">Semestre</label>
              <input type="text" id="reg-semestre" required placeholder="Ej. 5° Semestre" />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-programa">Programa académico</label>
            <input type="text" id="reg-programa" required placeholder="Ej. Licenciatura en Enfermería" />
          </div>
          <button type="submit" class="ev-btn" id="reg-submit-btn" style="width:100%;">Registrarme</button>
          <p id="reg-status" class="status-msg"></p>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwvRexIpb_5vCZ-72Hh4qWG-wwPlShY3k",
      authDomain: "musa-lasallebjx.firebaseapp.com",
      projectId: "musa-lasallebjx",
      storageBucket: "musa-lasallebjx.firebasestorage.app",
      messagingSenderId: "987361839924",
      appId: "1:987361839924:web:7611bcd62db66df4217361",
      measurementId: "G-C342LRNRCD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentEvent = null;
    let currentEventId = "";

    async function cargarEvento() {
      const params = new URLSearchParams(window.location.search);
      currentEventId = params.get("id") || "";
      const loading = document.getElementById("ev-loading");

      if (!currentEventId) {
        loading.textContent = "No se especificó ningún evento.";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "eventos", currentEventId));
        if (!snap.exists()) {
          loading.textContent = "No se encontró el evento solicitado.";
          return;
        }

        currentEvent = snap.data();

        // Aplicar colores personalizados del evento
        document.documentElement.style.setProperty("--ev-bg", currentEvent.colorFondo || "#fcfbf5");
        document.documentElement.style.setProperty("--ev-accent", currentEvent.colorAcento || "#4a145c");

        document.title = `${currentEvent.titulo || "Evento"} | MUSA La Salle Bajío`;
        document.getElementById("ev-title").textContent = currentEvent.titulo || "Evento MUSA";

        if (currentEvent.flyer) {
          document.getElementById("ev-flyer-img").src = currentEvent.flyer;
          document.getElementById("ev-flyer-wrap").style.display = "block";
        }

        const pills = [];
        if (currentEvent.fecha) pills.push(`📅 ${currentEvent.fecha}`);
        if (currentEvent.hora) pills.push(`⏰ ${currentEvent.hora}`);
        if (currentEvent.lugar) pills.push(`📍 ${currentEvent.lugar}`);
        document.getElementById("ev-pills").innerHTML = pills.map((p) => `<span class="ev-pill">${p}</span>`).join("");

        document.getElementById("ev-info-body").innerHTML = marked.parse(
          currentEvent.infoCompleta || currentEvent.descripcionRapida || ""
        );

        if (currentEvent.habilitarRegistro === false) {
          document.getElementById("ev-form-section").style.display = "none";
        }

        loading.style.display = "none";
        document.getElementById("ev-content").style.display = "flex";
      } catch (err) {
        console.error(err);
        loading.textContent = "Error al cargar el evento.";
      }
    }

    document.getElementById("ev-reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-submit-btn");
      const status = document.getElementById("reg-status");
      btn.disabled = true;
      status.textContent = "Enviando registro...";
      status.className = "status-msg";

      try {
        await addDoc(collection(db, "registros_eventos"), {
          eventoId: currentEventId,
          eventoTitulo: currentEvent?.titulo || "",
          nombre: document.getElementById("reg-nombre").value.trim(),
          matricula: document.getElementById("reg-matricula").value.trim(),
          programa: document.getElementById("reg-programa").value.trim(),
          semestre: document.getElementById("reg-semestre").value.trim(),
          registradoEn: Date.now()
        });
        document.getElementById("ev-reg-form").reset();
        status.textContent = "¡Registro completado con éxito! Te esperamos en la actividad.";
        status.className = "status-msg ok";
      } catch (err) {
        console.error(err);
        status.textContent = "No se pudo guardar tu registro. Intenta de nuevo.";
        status.className = "status-msg err";
      } finally {
        btn.disabled = false;
      }
    });

    cargarEvento();
  </script>
</body>
</html>
